name: voice-assistant

services:
  backend:
    build: .
    container_name: voice-backend
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - ../../../.env
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./app:/app/app:ro
      - ./whisper-cache:/root/.cache
    gpus: all

