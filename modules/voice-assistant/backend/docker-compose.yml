name: voice-assistant

services:
  backend:
    build:
      # The repo root: the image needs modules/llm and modules/stt, which sit
      # outside this directory.
      context: ../../..
      dockerfile: modules/voice-assistant/backend/Dockerfile
    container_name: voice-backend
    ports:
      - "8001:8001"
    env_file:
      - ../../../.env
    volumes:
      - ./app:/app/app:ro
      - ../../../modules/llm:/app/modules/llm:ro
      - ../../../modules/stt:/app/modules/stt:ro

