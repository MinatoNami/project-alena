# ALENA tool policy
#
# MCP says what a tool is and how to call it. This file says who may call it,
# against which repository, and whether a human has to agree first.
#
# The policy fails closed: a tool that is not listed here cannot be called at
# all, even if an MCP server advertises it. That is what makes "every tool
# declares its side effect" an enforced rule rather than a convention.
#
# Side effects, least to most consequential:
#   read_only  local_write  repository_write  remote_write
#   infrastructure_change  destructive
#
# APPROVAL IS PER AGENT. `requires_approval: true` means every agent;
# a list means those agents. The interactive assistant editing a file because
# its user just asked it to is a different act from an autonomous run editing
# a repository overnight, and they need different answers for the same tool.
#
# The action agent's approval comes from a recorded human decision: accepting
# a recommendation issues a grant scoped to one repository, capped at
# repository_write, and dropped when the run ends. See modules/gateway/grants.py.

version: 1

defaults:
  requires_approval: false
  repositories: ["*"]

tools:
  # --- Codex MCP -----------------------------------------------------------
  # Read-only Codex modes run `codex exec` without --apply, so they inspect
  # but do not write.
  codex_generate:
    side_effect: read_only
    allowed_agents: ["assistant", "thinking-agent", "codex"]

  codex_plan:
    side_effect: read_only
    allowed_agents: ["assistant", "thinking-agent", "codex", "repository-analyzer"]

  codex_analyze:
    side_effect: read_only
    allowed_agents: ["assistant", "thinking-agent", "codex", "repository-analyzer"]

  codex_summarize:
    side_effect: read_only
    allowed_agents: ["assistant", "thinking-agent", "codex", "repository-analyzer"]

  codex_doc_outline:
    side_effect: read_only
    allowed_agents: ["assistant", "thinking-agent", "codex"]

  codex_test_plan:
    side_effect: read_only
    allowed_agents: ["assistant", "thinking-agent", "codex"]

  # codex_edit and codex_refactor run `codex exec --full-auto --sandbox
  # workspace-write`. They write to whatever repo_path they are handed, which
  # is why Phase 1 resolves that path from the repository registry rather than
  # from model output.
  codex_edit:
    side_effect: repository_write
    allowed_agents: ["assistant", "action-agent"]
    # The assistant is unchanged: a user asking it to edit a file is the
    # approval. The action agent needs an accepted recommendation behind it.
    requires_approval: ["action-agent"]

  codex_refactor:
    side_effect: repository_write
    allowed_agents: ["assistant", "action-agent"]
    requires_approval: ["action-agent"]

  # --- Google Calendar MCP -------------------------------------------------
  google_list_events:
    side_effect: read_only
    allowed_agents: ["assistant"]

  google_create_event:
    side_effect: remote_write
    allowed_agents: ["assistant"]

  google_update_event:
    side_effect: remote_write
    allowed_agents: ["assistant"]

  # Deleting a calendar event destroys data that ALENA cannot restore.
  google_delete_event:
    side_effect: destructive
    allowed_agents: ["assistant"]

  # --- alena-core MCP ------------------------------------------------------
  # ALENA's own capabilities, exposed so Claude, ChatGPT and local models reach
  # one implementation instead of three.
  #
  # Every one of these is read_only, and that is a property of the server
  # rather than a coincidence: a client configured to reach alena-core talks to
  # it directly, without ALENA's gateway in between. Read-only by construction
  # is what makes that safe to expose. A test asserts it, so adding a tool here
  # that writes fails the build rather than quietly widening the surface.
  repo.search:
    side_effect: read_only
    allowed_agents: ["*"]

  repo.find_todos:
    side_effect: read_only
    allowed_agents: ["*"]

  repo.get_dependencies:
    side_effect: read_only
    allowed_agents: ["*"]

  repo.get_history:
    side_effect: read_only
    allowed_agents: ["*"]

  memory.search:
    side_effect: read_only
    allowed_agents: ["*"]

  recommendation.search:
    side_effect: read_only
    allowed_agents: ["*"]

  portfolio.search_capability:
    side_effect: read_only
    allowed_agents: ["*"]

  portfolio.dependency_divergence:
    side_effect: read_only
    allowed_agents: ["*"]

  # The doorway to alena-core's resources, for clients that have no way to read
  # a resource -- which includes ALENA's own planner, since an OpenAI-compatible
  # tools array is the only channel a local model has.
  resource.list:
    side_effect: read_only
    allowed_agents: ["*"]

  resource.read:
    side_effect: read_only
    allowed_agents: ["*"]

# Per-repository overrides. Deny always beats allow. A repository with no entry
# here inherits whatever the tool policy above permits.
#
# repositories:
#   production-control-plane:
#     allow: ["repo.*", "git.read.*", "dependency.*", "test.*"]
#     deny: ["git.push", "infrastructure.apply", "database.write"]
